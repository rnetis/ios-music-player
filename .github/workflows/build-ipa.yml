name: Build Unsigned IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          # VLCKit's binary zip lives on download.videolan.org, which has
          # intermittent outages ("The request timed out" / empty responses).
          # Retry so a CDN blip doesn't fail the whole run.
          for i in 1 2 3 4 5 6 7 8; do
            if xcodebuild -project RyanPlayer.xcodeproj -scheme RyanPlayer -resolvePackageDependencies; then
              echo "Package resolution succeeded (attempt $i)"
              exit 0
            fi
            echo "Package resolution failed (attempt $i) — retrying in 60s..."
            sleep 60
          done
          exit 1

      - name: Build unsigned app (device, arm64)
        run: |
          VERSION="1.0.0"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          xcodebuild \
            -project RyanPlayer.xcodeproj \
            -scheme RyanPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/RyanPlayer.app" Payload/
          zip -r -y "RyanPlayer-unsigned.ipa" Payload

      - name: Upload IPA artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: RyanPlayer-unsigned-ipa
          path: RyanPlayer-unsigned.ipa

      - name: Create GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RyanPlayer-unsigned.ipa
          name: RyanPlayer ${{ github.ref_name }}
          generate_release_notes: true
