name: MusicPlayer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    # SPM manifests exist only on the default branch (`master`, VLCKit 4.0-dev,
    # checksum-pinned binary target) — no released 3.x tag has a root Package.swift.
    branch: master
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: MusicPlayer
    dependencies:
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.musicplayer
        INFOPLIST_FILE: MusicPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  MusicPlayer:
    build:
      targets:
        MusicPlayer: all
    run:
      config: Debug
    archive:
      config: Release
